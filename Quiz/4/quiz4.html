<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>クイズ 4｜高知高専 星瞬祭 ARクイズラリー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: var(--ksfn-blue); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
        .quiz-container { background: #ffffff; border-radius: 24px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .chara-img { width: 120px; height: 120px; object-fit: contain; margin: 8px auto; display: block; }
        .question-title { font-size: 18px; font-weight: 900; color: var(--ksfn-dark-blue); margin-bottom: 16px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
        .option-btn { background: #f8fafc; border: 3px solid #cbd5e1; border-radius: 16px; padding: 12px; font-size: 16px; font-weight: 800; color: var(--text-color); cursor: pointer; transition: all 0.15s ease; text-align: center; }
        .option-btn:active { transform: scale(0.98); background: #e2e8f0; }
        .feedback { display: none; font-size: 18px; font-weight: 900; margin-top: 12px; padding: 10px; border-radius: 12px; }
        .correct { background-color: #dcfce7; color: #15803d; border: 2px solid #22c55e; }
        .incorrect { background-color: #fee2e2; color: #b91c1c; border: 2px solid #ef4444; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="badge" style="background:var(--ksfn-dark-blue); color:#fff; padding:4px 12px; border-radius:12px; font-weight:900; font-size:12px; display:inline-block;">ダイ4モン</div>
        <img src="../../images/marker/karanchan_c_009_r_350.jpg" alt="カランちゃんカプセル" class="chara-img">
        <h2 class="question-title"><ruby>高知高専<rt>こうちこうせん</rt></ruby>の<ruby>文化祭<rt>ぶんかさい</rt></ruby>の なまえはなにかな？</h2>
        
        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer(true)">星瞬祭（せいしゅんさい）</button>
            <button class="option-btn" onclick="checkAnswer(false)">清流祭（せいりゅうさい）</button>
            <button class="option-btn" onclick="checkAnswer(false)">黒潮祭（くろしおさい）</button>
            <button class="option-btn" onclick="checkAnswer(false)">高専祭（こうせんさい）</button>
        </div>

        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        function checkAnswer(isCorrect) {
            const fb = document.getElementById('feedback');
            if (isCorrect) {
                fb.className = 'feedback correct';
                fb.innerHTML = '⭕ 大正解！ 星瞬祭だよ！';
                fb.style.display = 'block';
                let bit = Number(localStorage.getItem('bit')) || 0;
                bit |= (1 << 3);
                localStorage.setItem('bit', bit);
                setTimeout(() => { window.location.href = '../../clear.html'; }, 1200);
            } else {
                fb.className = 'feedback incorrect';
                fb.innerHTML = '❌ ざんねん！ もういちど選んでね！';
                fb.style.display = 'block';
            }
        }
    </script>
</body>
</html>
